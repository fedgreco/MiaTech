<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: '#9671DE',
                        secondary: '#F0F0F0',
                    },
                    fontFamily: {
                        style: ['Courier New', 'monospace'],
                    },
                    fontSize: {
                        size: '2rem',
                    },
                    spacing: {
                        small: '1rem',
                        medium: '3rem',
                        large: '6rem',
                    },
                },
            },
        }
    </script>
    <style type="text/tailwindcss">
        @layer components {
            .btn {
                border: 2px solid gray;
                padding: 5px 10px;
                border-radius: 4px;
            }

            .card {
                @apply p-4 rounded text-white bg-primary;
            }

            .btn-primary {
                @apply btn text-white bg-primary;
            }

            .btn-secondary {
                @apply btn text-black bg-secondary hover:opacity-80;
            }
        }
    </style>
</head>

<body>

    <div class="flex flex-row justify-center m-4 p-4 gap-4">
        <button class="btn">Bottone 1</button>
        <button class="btn-secondary">Bottone 2</button>
        <button class="btn-primary">Bottone 3</button>
    </div>

    <div class="flex flex-col items-center m-4 p-4 gap-4">
        <button class="btn">Bottone 1</button>
        <button class="btn-secondary">Bottone 2</button>
        <button class="btn-primary">Bottone 3</button>
    </div>

    <div class="flex justify-center m-4 p-4 gap-4">
        <button class="btn">Bottone 1</button>
        <button class="btn-secondary">Bottone 2</button>
        <button class="btn-primary">Bottone 3</button>
    </div>

</body>

</html>
